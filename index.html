<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toolbox Gadgets — Under Construction | Garage Doors Opening Soon</title>
  <style>
    :root { --card: #ffffff; --ink: #181a24; --muted: #4b5563; --teal: #00bfa6; --pink: #ff2a85; --amber: #ffb703; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, sans-serif; color: var(--ink); line-height: 1.6;
      background-color: #fbf7ee;
      background-image:
        linear-gradient(to right, transparent 54px, #f87171aa 54px, #f87171aa 56px, transparent 56px),
        repeating-linear-gradient(to bottom, transparent 0px, transparent 31px, #60a5fa66 32px),
        radial-gradient(rgba(24,26,36,0.035) 1px, transparent 0);
      background-size: 100% 100%, 100% 32px, 6px 6px;
    }
    .wrap { max-width: 980px; margin: 0 auto; padding: 26px 20px 64px 72px; }
    nav {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
      background: var(--card); border: 3px solid var(--ink); border-radius: 14px;
      padding: 14px 22px 14px 66px; box-shadow: 7px 7px 0 var(--teal); margin-bottom: 28px;
      position: relative; overflow: hidden; transform: rotate(-0.6deg);
    }
    .marble-spine {
      position: absolute; left: 0; top: 0; bottom: 0; width: 46px; background: #181a24;
      background-image:
        radial-gradient(circle at 12px 14px, #fff 4px, transparent 5px),
        radial-gradient(circle at 30px 28px, #fff 6px, transparent 7px),
        radial-gradient(circle at 16px 46px, #fff 5px, transparent 6px),
        radial-gradient(circle at 34px 60px, #fff 4px, transparent 5px);
      background-size: 46px 72px; border-right: 4px dashed #ffffff;
    }
    .logo { font-weight: 900; font-size: 21px; letter-spacing: 0.04em; text-transform: uppercase; }
    .logo span { color: var(--pink); }
    .status-pill { background: var(--amber); border: 2.5px solid var(--ink); border-radius: 999px; padding: 5px 14px; font-weight: 900; font-size: 12px; text-transform: uppercase; }
    .garage-stage {
      background: var(--card); border: 3px solid var(--ink); border-radius: 18px;
      padding: 18px; box-shadow: 9px 9px 0 var(--pink); margin-bottom: 32px; text-align: center; transform: rotate(0.4deg);
    }
    svg.garage-svg { width: 100%; max-width: 860px; height: auto; display: block; margin: 0 auto; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 22px; margin-bottom: 28px; }
    .card { background: var(--card); border: 3px solid var(--ink); border-radius: 16px; padding: 22px; box-shadow: 7px 7px 0 var(--amber); transform: rotate(-0.35deg); }
    .card:nth-child(even) { transform: rotate(0.4deg); }
    .card h2 { margin: 0 0 8px; font-size: 20px; font-weight: 900; }
    .card p, .card li { color: var(--muted); font-size: 14.5px; }
    .socials, .bom { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 12px; }
    .pill-btn {
      display: inline-flex; align-items: center; gap: 7px; background: var(--teal); color: var(--ink); font-weight: 800;
      font-size: 13px; padding: 8px 13px; border: 2px solid var(--ink); border-radius: 9px;
      text-decoration: none; box-shadow: 3px 3px 0 var(--ink); transition: transform 0.1s ease;
    }
    .pill-btn:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0 var(--ink); }
    .pill-btn.pink { background: var(--pink); color: #fff; }
    .pill-btn.amber { background: var(--amber); }
    footer { border-top: 2px dashed #181a2444; padding-top: 18px; color: var(--muted); font-size: 12.5px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  </style>
</head>
<body>
  <svg style="position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;filter:drop-shadow(4px 4px 0 rgba(24,26,36,0.28));" xmlns="http://w3.org">
    <defs>
      <pattern id="memphisA" width="370" height="310" patternUnits="userSpaceOnUse">
        <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="370 310" dur="47s" repeatCount="indefinite" />
        <polyline points="22,55 44,28 66,55 88,28 110,55" fill="none" stroke="#ff2a85" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M 85 215 c 0,-12 18,-12 18,0 c 0,22 -30,22 -30,0 c 0,-32 42,-32 42,0 c 0,42 -54,42 -54,0" fill="none" stroke="#8b5cf6" stroke-width="5.5" stroke-linecap="round" />
        <polygon points="275,90 310,66 318,112" fill="#ffb703" stroke="#181a24" stroke-width="5.5" />
      </pattern>
      <pattern id="memphisB" width="290" height="410" patternUnits="userSpaceOnUse">
        <animateTransform attributeName="patternTransform" type="translate" from="290 0" to="0 410" dur="31s" repeatCount="indefinite" />
        <path d="M 35 120 Q 58 88, 81 120 T 127 120 T 173 120" fill="none" stroke="#00bfa6" stroke-width="6.5" stroke-linecap="round" />
        <polyline points="145,310 165,285 185,310 205,285 225,310" fill="none" stroke="#ffb703" stroke-width="6.5" stroke-linecap="round" />
        <circle cx="220" cy="175" r="14" fill="#ff2a85" stroke="#181a24" stroke-width="5.5" />
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#memphisA)" />
    <rect width="100%" height="100%" fill="url(#memphisB)" />
  </svg>
  <div class="wrap">
    <nav>
      <div class="marble-spine"></div>
      <div class="logo">Toolbox <span>Gadgets</span></div>
      <div class="status-pill">🚧 Under Construction · Garage Closed</div>
    </nav>
